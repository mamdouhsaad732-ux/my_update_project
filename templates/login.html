<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - النظام الطبي</title>
    <style>
        :root { --brand-blue: #0068a8; --brand-gold: #f8c000; }
        body { font-family: Tahoma, sans-serif; background: radial-gradient(1000px 520px at 82% -10%, rgba(0, 104, 168, 0.10), transparent 60%), radial-gradient(820px 420px at 8% 110%, rgba(248, 192, 0, 0.07), transparent 58%), #eef2f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: linear-gradient(180deg, rgba(0, 104, 168, 0.045) 0%, #ffffff 26%, #ffffff 100%); padding: 30px; border-radius: 8px; border: 1px solid #d9e5ef; border-top: 4px solid var(--brand-blue); box-shadow: 0 10px 30px rgba(0, 104, 168, 0.12); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #007bff; margin-bottom: 20px; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button { background: #007bff; color: white; border: none; padding: 12px; width: 95%; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0056b3; }
        .error { color: red; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>تسجيل الدخول للمنظومة</h2>
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
    <form action="/login" method="POST">
        <input type="text" name="username" placeholder="اسم المستخدم" required>
        <input type="password" name="password" placeholder="كلمة المرور" required>
        <button type="submit">دخول</button>
    </form>
</div>

</body>
</html>
