<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعذر حفظ التقرير</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --brand-blue: #0068a8; --danger: #dc2626; --muted: #64748b; }
        * { box-sizing: border-box; }
        body { font-family: Tahoma, "Segoe UI", sans-serif; background: radial-gradient(1100px 520px at 88% -12%, rgba(0, 104, 168, 0.08), transparent 62%), #f1f5f9; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; color: #1e293b; }
        .card { width: 100%; max-width: 520px; background: #fff; border: 1px solid #f3d6d6; border-top: 4px solid var(--danger); border-radius: 14px; box-shadow: 0 12px 40px rgba(15, 23, 42, 0.12); padding: 28px; text-align: center; }
        .icon { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%; background: #fef2f2; color: var(--danger); display: flex; align-items: center; justify-content: center; font-size: 26px; border: 1px solid #fecaca; }
        h1 { margin: 0 0 10px; font-size: 19px; color: #7f1d1d; }
        p { margin: 0 0 22px; font-size: 14.5px; line-height: 1.8; color: var(--muted); }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 20px; border-radius: 8px; background: var(--brand-blue); color: #fff; text-decoration: none; font-weight: bold; font-size: 14px; }
        .btn:hover { background: #004f80; }
    </style>
</head>
<body>
    <div class="card" role="alert">
        <div class="icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <h1>تعذر حفظ التقرير</h1>
        <p>{{ message }}</p>
        <a href="{{ back_url|default('/doctor') }}" class="btn"><i class="fa-solid fa-arrow-right"></i> العودة إلى لوحة التحكم</a>
    </div>
</body>
</html>
