<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>معاينة الفحص الطبي</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/dwv@0.33.1/dist/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; text-align: center; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; max-width: 800px; margin: 0 auto 15px auto; }
        .back-btn { background: #e74c3c; color: white; padding: 8px 16px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 14px; }
        .header-card { background: #1e293b; max-width: 800px; margin: auto; padding: 15px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); margin-bottom: 15px; text-align: right; }
        .viewer-container { max-width: 800px; height: 500px; margin: auto; background: black; border-radius: 12px; overflow: hidden; position: relative; border: 2px solid #334155; }
        #dwv { width: 100%; height: 100%; }
        .toolbar { margin-top: 15px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .btn { background: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .btn:hover { background: #1d4ed8; }
        .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="/doctor" class="back-btn"><i class="fas fa-arrow-right"></i> العودة لوحة التحكم</a>
        <h3 style="margin: 0; color: #38bdf8;">عارض صور DICOM الطبي</h3>
    </div>

    <div class="header-card">
        <p style="margin: 5px 0;"><strong>اسم المريض:</strong> {{ record.patient_name }}</p>
        <p style="margin: 5px 0;"><strong>نوع الفحص (Modality):</strong> {{ record.modality or 'غير متوفر' }}</p>
        <p style="margin: 5px 0;"><strong>تاريخ الميلاد:</strong> {{ record.birth_date or 'غير متوفر' }}</p>
    </div>

    <div class="viewer-container" id="dwv">
        <div class="layer" id="layerGroup0">
            <canvas class="imageLayer">متصفحك لا يدعم الـ Canvas</canvas>
        </div>
    </div>

    <div class="toolbar">
        <button class="btn" onclick="app.setTool('Scroll')"><i class="fa-solid fa-arrows-up-down"></i> تنقل الشرائح</button>
        <button class="btn" onclick="app.setTool('WindowLevel')"><i class="fa-solid fa-adjust"></i> السطوع والتباين</button>
        <button class="btn" onclick="app.setTool('ZoomAndPan')"><i class="fa-solid fa-magnifying-glass"></i> تكبير وتحريك</button>
        <button class="btn" style="background: #64748b;" onclick="app.reset()">إعادة ضبط</button>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/dwv@0.33.1/dist/dwv.min.js"></script>
    <script type="text/javascript">
        // تهيئة عارض الـ DWV
        let app = new dwv.App();
        app.init({
            containerDivId: 'dwv',
            fitToWindow: true,
            guiFlags: ['autotool']
        });

        // استقبال روابط الصور بشكل آمن من بايثون
        var dicomUrls = JSON.parse('{{ dicom_urls | tojson | safe }}');
        
        // التحميل المباشر للصور في عارض DWV الطبي
        if (dicomUrls && dicomUrls.length > 0) {
            app.loadFromUri(dicomUrls);
        } else {
            alert("لا توجد ملفات DICOM متاحة لهذا الفحص.");
        }
    </script>
</body>
</html>
